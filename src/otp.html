<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email — Reen Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="font-sans text-[#252525] bg-[#d4f3e7] min-h-screen">
    <div class="min-h-screen flex items-center">
      <div
        class="max-w-[1680px] w-full mx-auto px-6 lg:px-10 py-16 grid lg:grid-cols-2 gap-16 items-center"
      >
        <!-- LEFT PANEL -->
        <div class="max-w-xl">
          <a href="index.html" class="flex items-center mb-14">
            <img src="./assets/images/logo.png" alt="logo" />
          </a>
          <p class="text-[#33b786] font-medium text-2xl">Reen Bank</p>
          <h1 class="font-extrabold text-5xl sm:text-6xl leading-[1.05] mb-8">
            Verify it's really you
          </h1>
          <p class="text-[#555555] text-xl leading-relaxed mb-14 max-w-lg">
            We've sent a 6-digit code to your email. Enter it below to finish
            setting up your Reen Bank account.
          </p>
        </div>

        <!-- RIGHT PANEL / FORM -->
        <div
          class="bg-white rounded-[32px] p-8 sm:p-12 shadow-[0_0_150px_25px_rgba(51,183,134,0.25)] w-full max-w-xl mx-auto"
        >
          <h2 class="text-[#33b786] font-extrabold text-3xl sm:text-4xl mb-4">
            Enter Code
          </h2>
          <p class="text-[#6c6c6c] text-sm mb-8" id="otpEmailLine">
            Code sent to your email.
          </p>

          <div
            id="formError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>
          <div
            id="formSuccess"
            class="hidden mb-6 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3"
          ></div>

          <form id="otpForm" novalidate>
            <div class="flex gap-3 justify-between mb-8">
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                class="otp-digit w-full aspect-square text-center text-2xl font-bold border-2 border-gray-300 rounded-2xl outline-0 focus:border-[#33b786]"
              />
            </div>

            <button
              type="submit"
              class="btn-primary bg-green-500 border-green-500 border-2 text-white font-bold rounded-2xl text-center p-4 hover:bg-inherit hover:text-green-500 w-full"
            >
              Verify
            </button>

            <p class="text-center text-[#6c6c6c] text-sm mt-6">
              Didn't get a code?
              <button
                type="button"
                id="resendBtn"
                class="text-[#33b786] font-bold hover:underline disabled:text-gray-400 disabled:no-underline"
                disabled
              >
                Resend in <span id="resendTimer">60</span>s
              </button>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/otp.js"></script>
  </body>
</html>
