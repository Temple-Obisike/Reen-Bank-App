<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

  </head>
  <body class="font-sans text-ink bg-white/90 min-h-screen">
    <div class="flex min-h-screen">
      <!-- =========================== SIDEBAR =========================== -->
      <aside
        id="sidebar"
        class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white/90 p-6 flex flex-col items-center -translate-x-full lg:translate-x-0 transition-transform"
      >
        <a href="dashboard.html" class="flex items-center gap-3 mb-10 px-2">
          <!-- IMAGE: Reen Bank logo mark -->
          <img src="./assets/images/logo.png" alt="logo" />
        </a>
        <nav
          class="flex flex-col gap-8 space-y-1 my-auto"
          aria-label="App navigation"
        >
          <a
            href="dashboard.html"
            class="side-link active flex items-center justify-between gap-8"
          >
            <img src="./assets/images/overview-icon.png" alt="" />
            Overview
          </a>
          <a
            href="accounts.html"
            class="side-link flex items-center justify-between gap-8"
          >
            <img src="./assets/images/accounts-icon.png" alt="" />
            Accounts
          </a>
          <a
            href="transactions.html"
            class="side-link flex items-center justify-between gap-8"
          >
            <img src="./assets/images/transactions-icon.png" alt="" />
            Transactions
          </a>
          <a
            href="profile.html"
            class="side-link flex items-center justify-between gap-8"
          >
            <img src="./assets/images/profile-icon.png" alt="" />
            Profile
          </a>
        </nav>
        <button
          id="openLogout"
          class="side-link w-full text-red-500 hover:bg-red-50 flex justify-center items-center font-bold text-center gap-2"
        >
          <!-- <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
            />
          </svg> -->
          <span class="text-5xl mb-2"> ← </span>Logout
        </button>
      </aside>
      <div
        id="sidebarBackdrop"
        class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"
      ></div>

      <!-- =========================== MAIN =========================== -->
      <div class="flex-1 min-w-0">
        <header
          class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-black/5"
        >
          <div class="h-20 px-5 lg:px-10 flex items-center gap-3">
            <button
              id="menuToggle"
              class="lg:hidden p-2 rounded-lg hover:bg-black/5"
              aria-label="Open menu"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
            <h1 class="text-xl sm:text-2xl font-extrabold">Profile</h1>
          </div>
        </header>

        <main class="p-5 lg:p-10 max-w-3x flex flex-row gap-8">
          <!-- avatar -->
          <div
            class="flex flex-col md:w-[50%] border-2 border-gray-300 rounded-2xl"
          >
            <section
              class="pb-0 pt-5 bg-white rounded-t-2xl card-shadow flex flex-col gap-2 justify-center items-center"
            >
              <!-- IMAGE: user's profile photo can replace this initial avatar -->

              <div
                class="w-20 h-20 rounded-full bg-brand text-green-500 flex items-center justify-center text-3xl font-extrabold shrink-0 border-2 border-green-500"
                id="avatarBig"
              ></div>
              <div
                class="flex flex-col gap-2 items-center justify-center w-full"
              >
                <p class="text-xl font-extrabold" id="profileName">—</p>
                <p class="text-muted" id="profileEmail">—</p>
                <p
                  class="bg-purple-300 text-purple-600 font-medium py-2 px-6 rounded-xl"
                >
                  pro user
                </p>
              </div>
            </section>

            <!-- personal info -->
            <section class="rounded-b-2xl card-shadow sm:px-8 pb-4">
              <div
                id="infoSaved"
                class="hidden mb-6 rounded-xl bg-brand/10 border border-brand/30 text-brand-dark text-sm px-4 py-3"
              >
                Profile updated.
              </div>
              <form
                id="infoForm"
                class="flex flex-col items-start gap-3"
                novalidate
              >
                <div class="hidden">
                  <label for="pName" class="field-label">Full Name</label>
                  <input
                    id="pName"
                    type="text"
                    required
                    class="field-input !px-5"
                  />
                </div>
                <div
                  class="flex flex-col items-start justify-center w-full border-b-2 border-b-gray-300 pb-8"
                >
                  <label for="pEmail" class="field-label text-green-500"
                    >Email</label
                  >
                  <input
                    id="pEmail"
                    type="email"
                    required
                    class="field-input w-full outline-none text-[1.2rem] font-bold"
                  />
                </div>
                <div
                  class="flex flex-col items-start justify-center w-full border-b-2 border-b-gray-300 pb-8"
                >
                  <label for="pPhone" class="field-label text-green-500"
                    >Phone Number</label
                  >
                  <input
                    id="pPhone"
                    type="tel"
                    placeholder="e.g. 0803 000 0000"
                    class="field-input w-full outline-none text-[1.2rem] font-bold"
                  />
                </div>
                <div class="flex flex-col items-start justify-center">
                  <label for="pGender" class="field-label text-green-500"
                    >Gender</label
                  >
                  <select name="" id="pGender" class="p-0">
                    <option value="Male" selected>Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>
                <a
                  href="reset-password.html"
                  class="btn-outline bg-[#33b786] hover:bg-[#279971] font-medium rounded-2xl p-4 text-white w-full text-center"
                  >Reset Password</a
                >
              </form>
            </section>
          </div>
          <div class="flex flex-col md:w-[50%]">
            <div class="bg-[#d4f3e7] p-8 rounded-2xl">
              <div class="flex justify-between items-center">
                <p class="text-[#46237a] font-medium">Main Account</p>
                <button
                  class="eye-toggle w-9 h-9 rounded-lg border border-black/10 flex items-center justify-center hover:bg-black/5 shrink-0"
                  aria-label="Show or hide balance"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <div class="font-bold text-2xl" id="mainAccountBalance">$10</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="logoutOverlay" class="overlay">
      <div
        class="modal-card bg-white rounded-3xl p-8 max-w-sm w-full text-center"
      >
        <p class="font-bold text-lg mb-8">Are you sure you want to Logout?</p>
        <div class="flex gap-4">
          <button
            class="btn-outline flex-1 h-14! bg-gray-300 rounded-2xl p-4"
            onclick="closeOverlay('logoutOverlay')"
          >
            Cancel
          </button>
          <button
            class="btn-primary flex-1 bg-[#33b786] hover:bg-[#279971] rounded-2xl text-white font-medium"
            id="confirmLogout"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
    s

    <script src="./js/app.js"></script>
    <script src="./js/profile.js"></script>
  </body>
</html>
