<html lang="en">

    <meta charset="UTF-8" />

      rel="stylesheet"

  <body
    class="font-sans text-ink bg-mint min-h-screen flex items-center justify-center px-6 py-16"
  >
    <div class="w-full max-w-xl">
      <div
        class="bg-white rounded-2xl p-8 sm:p-12 shadow-2xl shadow-green-300 border-2 border-gray-300"
      >
        <!-- STEP 1: request reset -->
        <section id="stepEmail">
          <h1
            class="text-brand font-extrabold text-3xl sm:text-4xl mb-8 text-[#33b786]"
          >
            Reset Password
          </h1>
          <div
            id="emailError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>
          <form
            id="emailForm"
            novalidate
            class="flex flex-col gap-4 justify-between"
          >
            <div class="flex flex-col gap-2">
              <label for="resetEmail" class="field-label font-medium"
                >Email</label
              >
              <div
                class="field-wrap flex gap-2 justify-between items-center border-2 px-2 h-72"
              >
                <input
                  id="resetEmail"
                  type="email"
                  required
                  placeholder="Enter your Email"
                  class="field-input w-full outline-0 py-6"
                />
                <img src="./assets/images/envelope-icon.png" alt="" />
              </div>
            </div>
            <button
              type="submit"
              class="btn-primary bg-[#33b786] hover:bg-[#279971] rounded-2xl p-4 text-white font-medium w-full text-center"
            >
              Reset Password
            </button>
          </form>
          <p class="text-center text-sm mt-6 font-medium text-[#33b786]">
            <a href="login.html" class="text-muted hover:text-brand"
              >Back to Login</a
            >
          </p>
        </section>

        <!-- STEP 2: new password (OTP verification step intentionally omitted) -->
        <section id="stepNewPassword" class="hidden">
          <h1
            class="text-brand font-extrabold text-3xl sm:text-4xl mb-8 text-[#33b786]"
          >
            Enter new Password
          </h1>
          <div
            id="pwError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>
          <form
            id="newPwForm"
            novalidate
            class="flex flex-col gap-8 justify-between"
          >
            <div class="flex flex-col gap-2">
              <label for="newPw" class="font-medium">New Password</label>
              <div class="flex justify-between items-center gap-2">
                <input
                  id="newPw"
                  type="password"
                  required
                  minlength="6"
                  placeholder="Enter your Password"
                  class="w-full outline-0"
                />
                <img src="./assets/images/envelope-icon.png" alt="" />
              </div>
            </div>
            <div class="flex flex-col gap-2">
              <label for="retypePw" class="font-medium">Retype Password</label>
              <div class="flex justify-between items-center gap-2">
                <input
                  id="retypePw"
                  type="password"
                  required
                  minlength="6"
                  placeholder="Retype your Password"
                  class="w-full outline-0"
                />
                <img src="./assets/images/envelope-icon.png" alt="" />
              </div>
            </div>
            <button
              type="submit"
              class="bg-[#33b786] hover:bg-[#279971] rounded-2xl p-4 text-white font-medium w-full text-center"
            >
              Change Password
            </button>
          </form>
        </section>

        <!-- STEP 3: confirmation -->
        <section id="stepDone" class="hidden text-center">
          <!-- IMAGE: confirmation tick animation/illustration -->
          <span
            class="img-slot w-24 h-24 rounded-full mx-auto mb-6"
            data-caption="Confirmed tick animation"
            >✓</span
          >
          <p class="font-bold text-xl mb-8">Your password has been changed!</p>
          <a href="login.html"
            ><button
              type="button"
              class="btn-primary bg-[#33b786] hover:bg-[#279971] rounded-2xl p-4 text-white font-medium w-full text-center"
            >
              Go back
            </button></a
          >
        </section>
      </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/reset-password.js"></script>
  </body>
</html>
