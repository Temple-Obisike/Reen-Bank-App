<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
    />

  <body
    class="font-sans text-ink bg-mint min-h-screen flex items-center justify-center px-6 py-16"
  >
    <div class="w-full max-w-xl">
      <a href="index.html" class="flex items-center gap-3 mb-8 justify-center">
        <!-- IMAGE: Reen Bank logo mark -->
        <span
          class="img-slot w-11 h-11 rounded-xl"
          data-caption="Logo icon 44x44"
          >rb</span
        >
        <span class="text-lg font-extrabold">Reen Bank</span>
      </a>

      <div
        class="bg-white rounded-[32px] p-8 sm:p-12 shadow-[0_0_150px_25px_rgba(51,183,134,0.25)]"
      >
        <!-- STEP 1: request reset -->
        <section id="stepEmail">
          <h1 class="text-brand font-extrabold text-3xl sm:text-4xl mb-8">
            Reset Password
          </h1>
          <div
            id="emailError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>
          <form id="emailForm" novalidate>
            <div class="mb-8">
              <label for="resetEmail" class="field-label">Email</label>
              <div class="field-wrap">
                <input
                  id="resetEmail"
                  type="email"
                  required
                  placeholder="Enter your Email"
                  class="field-input"
                />
                <svg
                  class="field-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
              </div>
            </div>
            <button type="submit" class="btn-primary">Reset Password</button>
          </form>
          <p class="text-center text-sm mt-6">
            <a href="login.html" class="text-muted hover:text-brand"
              >Back to Login</a
            >
          </p>
        </section>

        <!-- STEP 2: new password (OTP verification step intentionally omitted) -->
        <section id="stepNewPassword" class="hidden">
          <h1 class="text-brand font-extrabold text-3xl sm:text-4xl mb-8">
            Enter new Password
          </h1>
          <div
            id="pwError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>
          <form id="newPwForm" novalidate>
            <div class="mb-6">
              <label for="newPw" class="field-label">New Password</label>
              <div class="field-wrap">
                <input
                  id="newPw"
                  type="password"
                  required
                  minlength="6"
                  placeholder="Enter your Password"
                  class="field-input"
                />
                <svg
                  class="field-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="4" y="10" width="16" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
              </div>
            </div>
            <div class="mb-8">
              <label for="retypePw" class="field-label">Retype Password</label>
              <div class="field-wrap">
                <input
                  id="retypePw"
                  type="password"
                  required
                  minlength="6"
                  placeholder="Retype your Password"
                  class="field-input"
                />
                <svg
                  class="field-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="4" y="10" width="16" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
              </div>
            </div>
            <button type="submit" class="btn-primary">Change Password</button>
          </form>
        </section>

        <!-- STEP 3: confirmation -->
        <section id="stepDone" class="hidden text-center">
          <!-- IMAGE: confirmation tick animation/illustration -->
          <span
            class="img-slot w-24 h-24 rounded-full mx-auto mb-6"
            data-caption="Confirmed tick animation"
            >✓</span
          >
          <p class="font-bold text-xl mb-8">Your password has been changed!</p>
          <a href="login.html" class="btn-primary">Go Back</a>
        </section>
      </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/reset-password.js"></script>
  </body>
</html>
