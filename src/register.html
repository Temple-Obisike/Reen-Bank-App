<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body class="font-sans text-[#252525] bg-[#d4f3e7] min-h-screen">
    <!-- IMAGE: faint repeating banking-icon pattern watermark can be tiled across this whole page background (10% opacity, matches Figma) -->

    <div class="min-h-screen flex items-center">
      <div
        class="max-w-[1680px] w-full mx-auto px-6 lg:px-10 py-16 grid lg:grid-cols-2 gap-16 items-center"
      >
        <!-- LEFT PANEL -->
        <div class="max-w-xl">
          <a href="index.html" class="flex items-center mb-14">
            <!-- IMAGE: Reen Bank logo mark -->
            <img src="./assets/images/logo.png" alt="logo" />
          </a>
          <p class="text-[#33b786] font-medium text-2xl">Reen Bank</p>
          <h1 class="font-extrabold text-5xl sm:text-6xl leading-[1.05] mb-8">
            Experience hassle-free banking
          </h1>
          <p class="text-[#555555] text-xl leading-relaxed mb-14 max-w-lg">
            Experience simple, secure, and stress-free banking. Say goodbye to
            long queues and complex procedures and hello to hassle-free banking
            with Reen Bank.
          </p>
          <div class="flex gap-3">
            <a
              href="#"
              aria-label="Facebook"
              class="w-10 h-10 rounded-full bg-[#33b786] text-white flex items-center justify-center hover:bg-[#33b786]-dark"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12"
                />
              </svg>
            </a>
            <a
              href="#"
              aria-label="Instagram"
              class="w-10 h-10 rounded-full bg-[#33b786] text-white flex items-center justify-center hover:bg-[#33b786]-dark"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M12 2c2.7 0 3.1 0 4.1.1 1.1.1 1.8.2 2.5.5.7.3 1.2.6 1.8 1.2.6.6.9 1.1 1.2 1.8.3.7.4 1.4.5 2.5.1 1 .1 1.4.1 4.1s0 3.1-.1 4.1c-.1 1.1-.2 1.8-.5 2.5-.3.7-.6 1.2-1.2 1.8-.6.6-1.1.9-1.8 1.2-.7.3-1.4.4-2.5.5-1 .1-1.4.1-4.1.1s-3.1 0-4.1-.1c-1.1-.1-1.8-.2-2.5-.5-.7-.3-1.2-.6-1.8-1.2-.6-.6-.9-1.1-1.2-1.8-.3-.7-.4-1.4-.5-2.5C2 15.1 2 14.7 2 12s0-3.1.1-4.1c.1-1.1.2-1.8.5-2.5.3-.7.6-1.2 1.2-1.8C4.4 3 4.9 2.7 5.6 2.4c.7-.3 1.4-.4 2.5-.5C9.1 2 9.5 2 12 2m0 1.8c-2.6 0-3 0-4 .1-.9 0-1.4.2-1.7.3-.4.2-.7.3-1 .6-.3.3-.5.6-.6 1-.1.3-.3.8-.3 1.7-.1 1-.1 1.4-.1 4s0 3 .1 4c0 .9.2 1.4.3 1.7.2.4.3.7.6 1 .3.3.6.5 1 .6.3.1.8.3 1.7.3 1 .1 1.4.1 4 .1s3 0 4-.1c.9 0 1.4-.2 1.7-.3.4-.2.7-.3 1-.6.3-.3.5-.6.6-1 .1-.3.3-.8.3-1.7.1-1 .1-1.4.1-4s0-3-.1-4c0-.9-.2-1.4-.3-1.7-.2-.4-.3-.7-.6-1-.3-.3-.6-.5-1-.6-.3-.1-.8-.3-1.7-.3-1-.1-1.4-.1-4-.1M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 1.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4m5.2-2a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0"
                />
              </svg>
            </a>
            <a
              href="#"
              aria-label="Twitter"
              class="w-10 h-10 rounded-full bg-[#33b786] text-white flex items-center justify-center hover:bg-[#33b786]-dark"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 0 0-7 3.7A11.6 11.6 0 0 1 3.4 4.6a4.1 4.1 0 0 0 1.3 5.5c-.7 0-1.3-.2-1.9-.5v.1a4.1 4.1 0 0 0 3.3 4 4 4 0 0 1-1.8.1 4.1 4.1 0 0 0 3.8 2.9A8.3 8.3 0 0 1 2 18.4a11.6 11.6 0 0 0 6.3 1.9c7.5 0 11.7-6.3 11.7-11.7v-.5c.8-.6 1.5-1.3 2-2.2"
                />
              </svg>
            </a>
          </div>
        </div>

        <!-- RIGHT PANEL / FORM -->
        <div
          class="bg-white rounded-[32px] p-8 sm:p-12 shadow-[0_0_150px_25px_rgba(51,183,134,0.25)] w-full max-w-xl mx-auto"
        >
          <h2 class="text-[#33b786] font-extrabold text-3xl sm:text-4xl mb-8">
            Register
          </h2>

          <div
            id="formError"
            class="hidden mb-6 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3"
          ></div>

          <form id="registerForm" novalidate class="flex flex-col gap-4">
            <label for="name">
              <span class="font-bold">name:</span>
              <div
                class="border-2 border-gray-300 p-4 rounded-2xl flex items-center gap-2"
              >
                <input
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Enter your name"
                  class="outline-0 text-black w-full"
                  required
                />
                <img src="./assets/images/profile-icon.png" alt="" />
              </div>
            </label>

            <label for="email">
              <span class="font-bold">email:</span>
              <div
                class="border-2 border-gray-300 p-4 rounded-2xl flex items-center gap-2"
              >
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="Enter your email"
                  class="outline-0 text-black w-full"
                  required
                />
                <img src="./assets/images/envelope-icon.png" alt="" />
              </div>
            </label>

            <label for="password">
              <span class="font-bold">password:</span>
              <div
                class="border-2 border-gray-300 p-4 rounded-2xl flex items-center gap-2"
              >
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="Enter your password"
                  class="outline-0 text-black w-full"
                  minlength="6"
                  autocomplete="new-password"
                  required
                />
                <img src="./assets/images/lock-icon.png" alt="" />
              </div>
            </label>

            <label class="flex items-start gap-3 cursor-pointer select-none">
              <input
                id="terms"
                type="checkbox"
                required
                class="mt-1 w-6 h-6 rounded-md border-2 border-[#555555] text-[#33b786] focus:ring-[#33b786]"
              />
              <span class="text-[#555555] text-base"
                >I agree to all the Terms, Privacy Policy and Fees.</span
              >
            </label>

            <button
              type="submit"
              class="btn-primary bg-green-500 border-green-500 border-2 text-white font-bold rounded-2xl text-center p-4 hover:bg-inherit hover:text-green-500 w-full"
            >
              Register
            </button>

            <p class="text-center text-[#6c6c6c] text-sm mt-6">
              Already have an Account?
              <a
                href="login.html"
                class="text-[#33b786] font-bold hover:underline"
                >Log in.</a
              >
            </p>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
